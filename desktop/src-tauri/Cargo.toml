[package]
name = "constellation-desktop"
version = "0.1.0"
description = "Constellation Command Center as a Windows desktop app"
edition = "2021"
publish = false

# The version people see is `version` in tauri.conf.json (set with `node scripts/desktop.mjs
# version x.y.z`); this one is Cargo's and is not used for anything.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
# The daemon client uses plain loopback HTTP. The updater shares reqwest and enables
# rustls-no-provider, so daemon_client installs its ring provider before building a client.
reqwest = { version = "0.13", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde_json = "1"
url = "2"
# The identity check before the token is handed over (see probe in main.rs): a random challenge,
# and HMAC-SHA256 of the daemon's answer. All three were already in the tree through tauri.
getrandom = "0.4"
hex = "0.4"
sha2 = "0.11"
# Hands links the dashboard opens in a new tab to the system browser (main_window in main.rs).
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
