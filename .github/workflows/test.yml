# Automated tests. See initiatives/automated-testing.md, Phase 3 (option A, chosen 2026-09-18):
# the fast layers run on every push, and the browser UI tests run only on pull requests into
# main, because they are the slow part.
#
# Both jobs run on Windows: the UI tests need Edge, and the fast job keeps to the machine the
# daemon runs on. Since 2026-09-26 the server suite also passes on Ubuntu (#31), so a Linux leg of
# the fast job is possible; it is the owner's call. The whole browser matrix, the screenshot gallery,
# and the report-only timings run weekly in weekly.yml.
name: Tests

on:
  push:
  pull_request:
    branches: [main]

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast:
    name: Server tests, typecheck, dashboard unit tests, build
    # A push to a branch with an open pull request fires both events. The push run already
    # reports on the same commit, so the pull request run skips this job.
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            command-center/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: command-center
      - run: npm run test:fast
      - run: npm run build

  # A floor under the server suite's coverage (command-center/package.json, test:coverage). It
  # reruns the suite, so it is its own job on Linux rather than a second pass in the Windows job
  # above, and it runs on both events: it is cheap, and a push to a branch without a pull request
  # should still see it. The floors sit a couple of points under what was measured on 2026-10-06
  # (lines 96.3, branches 88.8, functions 94.0). If it fails, add the missing tests; raise the
  # floors when coverage has risen, never lower them to get green. Not in the pre-push hook: it
  # would run the whole server suite a second time.
  coverage:
    name: Server test coverage floor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: command-center/package-lock.json
      - run: npm ci
        working-directory: command-center
      - run: npm run test:coverage
        working-directory: command-center

  ui:
    name: UI tests in Edge, part ${{ matrix.shard }} of 4
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      # One part failing must not cancel the other: its result is still worth having.
      fail-fast: false
      matrix:
        # Playwright splits the suite across the parts; each part runs one worker on its own
        # server and scratch database (e2e/fixtures.js), so nothing is shared. Two parts were
        # chosen on 2026-09-21 to keep the cost near what one job was (Windows minutes bill
        # double); four on 2026-09-26 when one worker a part took ten minutes. On 2026-09-27
        # workers inside a part were measured on this four-core runner: four workers contended
        # until tests timed out, and two workers took 14 minutes a part against 9 with one, so a
        # part stays at one worker and the parallelism is the parts. To change it, change this
        # list, the "of 4" above, and the --shard below together.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            command-center/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: command-center
      # windows-latest ships Microsoft Edge, which playwright.config.js drives through
      # channel 'msedge', so no browser download is needed.
      - run: npm run test:ui -- --shard=${{ matrix.shard }}/4
      - name: Keep traces and screenshots from failed UI tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-output-${{ matrix.shard }}
          path: .playwright/
          retention-days: 7

  # One check that speaks for every part, under the name the single job used to have. A part
  # that was cancelled or skipped is not a failure to GitHub, so without this a pull request
  # could look green with half the UI tests never run. Linux, because it only reads results.
  ui-passed:
    name: UI tests in Edge at desktop and phone widths
    needs: ui
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check that every part passed
        run: |
          echo "UI test parts: ${{ needs.ui.result }}"
          [ "${{ needs.ui.result }}" = "success" ] || exit 1

  # Which parts of the tree a pull request touches, for jobs that only matter when they change.
  # Nothing uses these outputs yet: .github/workflows/android.yml and desktop-ui.yml are
  # path-filtered at the workflow level on their open pull requests, and are meant to become jobs
  # here gated with `if: needs.changes.outputs.android == 'true'`. Keep these lists in step with
  # the paths those workflows use. Pull requests only, because a push run has no base to compare.
  changes:
    name: Which paths changed
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      android: ${{ steps.filter.outputs.android }}
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            android:
              - 'mobile/**'
              - 'src/**'
              - 'public/**'
              - 'package.json'
              - 'package-lock.json'
            desktop:
              - 'desktop/**'
              - 'scripts/desktop.mjs'
              - 'command-center/src/http/identity.ts'

  # The one check branch protection should require. The owner switches protection to `Tests`
  # (Settings, Branches) after this has run green on a pull request or two; until then the two
  # older names above keep working unchanged, so nothing blocks during the switch. A job that
  # was cancelled or skipped is not a failure to GitHub, so this job reads every result itself and
  # fails on anything but success. To add a job to the gate: add the job, add it to `needs`, and
  # add one line to the check below (`must_pass` for a job that always runs, `gated` for a job
  # that only runs when `changes` says its paths were touched).
  tests:
    name: Tests
    needs: [changes, fast, coverage, ui, ui-passed]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check that nothing failed, was cancelled, or was skipped by mistake
        run: |
          bad=0
          must_pass() {
            echo "$1: $2"
            [ "$2" = "success" ] || bad=1
          }
          # A path-gated job may be skipped, but only when `changes` said its paths were not
          # touched. If `changes` itself failed, its output is empty and a skip is a failure.
          # Example: gated android "${{ needs.android.result }}" "${{ needs.changes.outputs.android }}"
          gated() {
            echo "$1: $2 (needed: $3)"
            if [ "$2" = "success" ]; then return; fi
            if [ "$2" = "skipped" ] && [ "$3" = "false" ]; then return; fi
            bad=1
          }
          must_pass changes "${{ needs.changes.result }}"
          must_pass coverage "${{ needs.coverage.result }}"
          must_pass ui "${{ needs.ui.result }}"
          must_pass ui-passed "${{ needs.ui-passed.result }}"
          # `fast` is skipped on pull requests by design (the push run covers the same commit),
          # so a skip is fine but a failure or cancel is not.
          echo "fast: ${{ needs.fast.result }}"
          case "${{ needs.fast.result }}" in success|skipped) ;; *) bad=1 ;; esac
          exit $bad
