# Coverage-guided fuzzing (Jazzer.js) of the parsers that read text the owner did not write or
# typed without a form: repo checklists, imported task text, due dates, recurrence rules, the
# rule pattern engine, rule definitions, the thread post fence, and the encrypted backup
# container. The REST body schemas are zod, a dependency the fuzzer does not instrument, so they
# stay with the property tests. See CONTRIBUTING.md, "Coverage-guided fuzzing". The fast-check
# property tests stay in nightly-properties.yml. Nothing here is a pull request check: fuzzing is
# open-ended by nature, so it runs nightly and reports through issues instead of failing PRs.
#
# A crash opens the issue "Fuzz crash: <target>" (or comments on it when it is already open) with
# the input in base64, the run, and the end of the fuzzer log. Only the report job may write
# issues; the fuzzing jobs run with read access. GitHub stops a schedule after 60 days without a
# commit; a manual run restarts it.
name: Fuzz

on:
  schedule:
    - cron: '30 4 * * *'  # every day 04:30 UTC, after the property tests
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes to fuzz each target (at most 60)
        type: number
        default: 10

# A manual run should not cancel the night's, and the night's should not cancel a manual one.
concurrency:
  group: fuzz-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    # Expressions have no arithmetic, so this is a ceiling rather than the budget plus a margin.
    # The budget itself is capped to fit under it in the Fuzz step.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        target: [backup, checklist, due, pattern, post-fence, recurrence, rules, task-text]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            command-center/package-lock.json
      # Both packages: Jazzer.js is command-center's, esbuild is the root's (fuzz/bundle.mjs).
      - run: npm ci
      - run: npm ci
        working-directory: command-center

      # The evolved corpus is the point of running nightly: each run starts from the last one's
      # coverage. Every run saves under a fresh key and restores the newest one for its target.
      - name: Restore corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: command-center/fuzz/.corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Fuzz
        # Explicit, so the step runs with pipefail and a crash fails it through tee.
        shell: bash
        working-directory: command-center
        env:
          TARGET: ${{ matrix.target }}
          MINUTES: ${{ inputs.minutes || 10 }}
        run: |
          minutes=$(( MINUTES > 60 ? 60 : MINUTES ))
          minutes=$(( minutes < 1 ? 1 : minutes ))
          export FUZZ_SECONDS=$(( minutes * 60 ))
          mkdir -p "fuzz/crashes/$TARGET"
          npm run fuzz -- "$TARGET" 2>&1 | tee "fuzz/crashes/$TARGET/fuzz.log"

      # Save even when the fuzzer found a crash, so the run's coverage is kept.
      - name: Save corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: command-center/fuzz/.corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      - name: Upload crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: command-center/fuzz/crashes/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 30

  # Kept apart from the jobs that run the fuzzer so they never hold a token that can write issues.
  report:
    name: Report crashes
    needs: fuzz
    if: always() && needs.fuzz.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SHA: ${{ github.sha }}
    steps:
      - name: Download crash artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: fuzz-crash-*
          path: crashes

      - name: Open or update issues
        run: |
          shopt -s nullglob
          for dir in crashes/fuzz-crash-*; do
            target="${dir#crashes/fuzz-crash-}"
            inputs=("$dir"/crash-* "$dir"/oom-* "$dir"/timeout-* "$dir"/slow-unit-*)
            # No input file means the target failed some other way (build or install); the failed
            # job in the run says why, so there is no issue.
            [ ${#inputs[@]} -gt 0 ] || continue
            title="Fuzz crash: $target"
            first="${inputs[0]}"
            size=$(wc -c < "$first")
            {
              echo "The nightly fuzz run found an input that makes the \`$target\` target fail."
              echo
              echo "- Run: $RUN_URL (artifact \`fuzz-crash-$target\`, file \`$(basename "$first")\`, kept 30 days)"
              echo "- Commit: $SHA"
              echo
              echo "Replay from command-center/ with the file from the artifact:"
              echo
              echo '```sh'
              echo "npm run fuzz:repro -- $target path/to/$(basename "$first")"
              echo '```'
              echo
              echo "Fix the bug, then add the input as a named regression test next to the code (see CONTRIBUTING.md, Coverage-guided fuzzing)."
              echo
              echo "Input ($size bytes, base64; a larger input is in the artifact only):"
              echo '```'
              if [ "$size" -le 4000 ]; then base64 -w 76 "$first"; else echo "(see artifact)"; fi
              echo '```'
              echo
              echo '<details><summary>End of the fuzzer log</summary>'
              echo
              echo '```'
              # Printed as data: the log quotes the input, which can hold anything.
              tail -n 40 "$dir/fuzz.log" | sed 's/```/` ` `/g'
              echo '```'
              echo '</details>'
            } > body.md
            number=$(gh issue list --state open --search "\"$title\" in:title" \
              --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
            if [ -n "$number" ]; then
              gh issue comment "$number" --body-file body.md
              echo "commented on #$number for $target"
            else
              gh issue create --title "$title" --body-file body.md --label bug
              echo "opened an issue for $target"
            fi
          done
